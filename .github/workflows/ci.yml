name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check orchestrator worker scripts tests

      - name: mypy
        run: mypy orchestrator worker

      - name: pytest
        run: pytest -v --cov --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build orchestrator image
        run: docker build -t agent-orchestrator:ci .

      - name: Build sandbox image
        run: docker build -t agent-orchestrator-sandbox:ci ./sandbox
